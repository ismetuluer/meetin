<script>
const ANIMS=[["graze","Otla",4200],["baa","Mele",1500],["stare","Bana bak",2800],["sleep","Uyu",5200],["eat","İfade ye",1700],["hop","Sevin",1600],["sad","Üzül",1500],["squeeze","Sık",900]];
const svg=document.getElementById('sheep'),bubble=document.getElementById('bubble'),grid=document.getElementById('grid');
let anim='idle',timers=[],auto=true,lastUser=0,holdT=null,held=false;
function flags(a){return{eyeOpen:!['sleep','hop','sad'].includes(a),eyeClosed:a==='sleep',eyeHappy:a==='hop',eyeSad:a==='sad',
 mSmile:['idle','stare','sleep','squeeze'].includes(a),mOpen:a==='baa'||a==='hop',mChew:a==='graze'||a==='eat',mSad:a==='sad',isSleep:a==='sleep',isBaa:a==='baa'};}
function render(){svg.setAttribute('class','sheep k-b2 a-'+anim);const f=flags(anim);
 svg.querySelectorAll('[data-if]').forEach(g=>g.style.display=f[g.dataset.if]?'':'none');
 svg.querySelectorAll('.cheek').forEach(c=>c.setAttribute('opacity',['eat','hop','baa'].includes(anim)?.95:.5));
 bubble.style.display=anim==='baa'?'block':'none';
 grid.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.id===anim));}
function set(a){anim=a;render();}
function clear(){timers.forEach(clearTimeout);timers=[];}
function play(id,user){if(user)lastUser=Date.now();clear();set('idle');
 timers.push(setTimeout(()=>{set(id);const d=(ANIMS.find(x=>x[0]===id)||[0,0,1500])[2];timers.push(setTimeout(()=>set('idle'),d));},30));}
ANIMS.forEach(([id,l])=>{const b=document.createElement('button');b.textContent=l;b.dataset.id=id;b.onclick=()=>play(id,true);grid.appendChild(b);});
document.getElementById('auto').onclick=e=>{auto=!auto;e.target.textContent='Kendi hâlinde: '+(auto?'Açık':'Kapalı');};
setInterval(()=>{if(!auto||anim!=='idle'||Date.now()-lastUser<5000)return;const p=['graze','graze','baa','stare','hop'];play(p[Math.floor(Math.random()*p.length)],false);},6000);
document.addEventListener('pointermove',e=>{if(anim==='sleep')return;const r=svg.getBoundingClientRect(),cx=r.left+r.width*.5,cy=r.top+r.height*.53,dx=e.clientX-cx,dy=e.clientY-cy,d=Math.hypot(dx,dy)||1,m=Math.min(d/60,1)*4.2;
 svg.querySelectorAll('.pupil').forEach(p=>{p.style.transform='translate('+(dx/d*m).toFixed(1)+'px,'+(dy/d*m).toFixed(1)+'px)';p.style.transition='transform .12s';});});
const hit=document.getElementById('hit');
hit.addEventListener('pointerdown',()=>{lastUser=Date.now();held=false;clear();set('squeeze');clearTimeout(holdT);holdT=setTimeout(()=>held=true,450);});
hit.addEventListener('pointerup',()=>{clearTimeout(holdT);if(anim!=='squeeze')return;play(held?'eat':'baa',true);held=false;});
hit.addEventListener('pointerleave',()=>{clearTimeout(holdT);if(anim==='squeeze')set('idle');});
render();
</script></body></html>
