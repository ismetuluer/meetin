[package]
name = "meetin"
version = "0.0.1"
description = "Meetin - Windows metin genişletici"
authors = ["Saul"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "meetin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.7" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
