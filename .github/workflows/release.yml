name: Meetin Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rust kur
        uses: dtolnay/rust-toolchain@stable

      - name: Bağlılıkları kur ve test et
        run: |
          npm ci
          npm test
          npm run build
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: NSIS Kurulum ve Release EXE oluştur
        run: npx tauri build --bundles nsis

      - name: İsteğe bağlı Windows Authenticode kod imzalama
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_PASSWORD)) {
            Write-Host "WINDOWS_CERT_PFX_BASE64 veya WINDOWS_CERT_PASSWORD tanimli degil; Windows Authenticode imzalama adimi atlaniyor."
            exit 0
          }

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe bulunamadi; Windows SDK kurulu olmalidir."
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "meetin-codesign.pfx"
          try {
            $pfxBytes = [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64.Trim())
            [System.IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

            $targets = @()
            $releaseExe = "src-tauri/target/release/meetin.exe"
            if (Test-Path $releaseExe) { $targets += (Resolve-Path $releaseExe).Path }
            $setupExes = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue
            foreach ($s in $setupExes) { $targets += $s.FullName }

            foreach ($bin in $targets) {
              Write-Host "Authenticode imzalaniyor: $bin"
              & $signtool.FullName sign /fd SHA256 /f $pfxPath /p $env:WINDOWS_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $bin
              if ($LASTEXITCODE -ne 0) {
                throw "signtool.exe basarisiz oldu: $bin"
              }
            }
          }
          finally {
            if (Test-Path -LiteralPath $pfxPath) {
              Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Portable ZIP oluştur
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          ./scripts/package-portable.ps1 -Version $tag -SkipBuild

      - name: Sürüm notlarını CHANGELOG.md'den çıkar
        shell: pwsh
        run: |
          # "## [X.Y.Z]" başlığından bir sonraki "## [" başlığına kadar olan bölüm
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match ('^## \[' + [regex]::Escape($tag) + '\]')) { $start = $i; break }
          }
          if ($start -lt 0) { throw "CHANGELOG.md içinde [$tag] bölümü yok; sürüm notu yazılmadan yayın çıkmaz." }
          $end = $lines.Count
          for ($j = $start + 1; $j -lt $lines.Count; $j++) {
            if ($lines[$j] -match '^## \[') { $end = $j; break }
          }
          $body = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          New-Item -ItemType Directory -Path "dist-packages" -Force | Out-Null
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path "dist-packages").Path "release-notes.md"), $body + "`n", $utf8NoBom)
          Write-Host $body

      - name: GitHub Release yayımla
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            dist-packages/Meetin_*_portable.zip
          name: Meetin ${{ github.ref_name }}
          body_path: dist-packages/release-notes.md
          generate_release_notes: false
